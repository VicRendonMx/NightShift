
<h2 class="sr-only">Entity-relationship diagram for the Toronto nightlife app database</h2>
<style>
#erd { width: 100%; }
#erd svg { width: 100%; height: auto; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2a2a28' : '#f5f4f0',
    primaryBorderColor: dark ? '#4a4a46' : '#c8c6bc',
    primaryTextColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
  er: { diagramPadding: 20, layoutDirection: 'TB', minEntityWidth: 100, minEntityHeight: 75, entityPadding: 15, useMaxWidth: true }
});

const diagram = `erDiagram
  VENUE {
    uuid id PK
    string name
    string slug
    string address
    string neighbourhood
    float lat
    float lng
    string venue_type
    string[] vibe_tags
    string[] music_genres
    int capacity
    int min_age
    string dress_code
    bool has_cover_charge
    string cover_notes
    bool is_verified
    string instagram_handle
    string website_url
    bool is_active
    timestamp created_at
    timestamp updated_at
  }

  HOURS {
    uuid id PK
    uuid venue_id FK
    int day_of_week
    time open_time
    time close_time
    bool is_closed
    bool is_after_hours
  }

  NEIGHBOURHOOD {
    uuid id PK
    string name
    string slug
    string description
    string vibe_summary
    float lat
    float lng
    int sort_order
  }

  EVENT {
    uuid id PK
    uuid venue_id FK
    string title
    string description
    string event_type
    string[] music_genres
    timestamp start_time
    timestamp end_time
    bool is_recurring
    string recurrence_rule
    bool is_free
    float ticket_price_min
    float ticket_price_max
    string ticket_url
    string external_id
    string external_source
    bool is_cancelled
    timestamp created_at
  }

  PERFORMER {
    uuid id PK
    string name
    string performer_type
    string genre
    string instagram_handle
    string spotify_id
    bool is_local
  }

  EVENT_PERFORMER {
    uuid event_id FK
    uuid performer_id FK
    string role
    time set_time
  }

  DEAL {
    uuid id PK
    uuid venue_id FK
    string title
    string description
    string deal_type
    int day_of_week
    time valid_from
    time valid_until
    float original_price
    float deal_price
    bool is_realtime
    timestamp expires_at
    bool is_active
  }

  VENUE_PHOTO {
    uuid id PK
    uuid venue_id FK
    string url
    string caption
    string source
    bool is_primary
    int sort_order
    timestamp taken_at
  }

  USER {
    uuid id PK
    string display_name
    string email
    string avatar_url
    string[] preferred_vibes
    string[] preferred_genres
    string neighbourhood_pref
    int budget_min
    int budget_max
    int min_age_pref
    timestamp created_at
    timestamp last_active_at
  }

  CHECKIN {
    uuid id PK
    uuid user_id FK
    uuid venue_id FK
    uuid event_id FK
    int crowd_rating
    int vibe_rating
    int noise_level
    int wait_time_min
    string note
    timestamp checked_in_at
    bool is_anonymous
  }

  REVIEW {
    uuid id PK
    uuid user_id FK
    uuid venue_id FK
    int overall_rating
    int vibe_rating
    int value_rating
    int safety_rating
    string body
    bool is_anonymous
    int helpful_count
    timestamp created_at
  }

  SAFETY_FLAG {
    uuid id PK
    uuid venue_id FK
    uuid user_id FK
    string flag_type
    string description
    string status
    timestamp flagged_at
    timestamp resolved_at
  }

  GROUP_PLAN {
    uuid id PK
    uuid creator_user_id FK
    string name
    string share_code
    timestamp planned_for
    int budget_per_person
    string status
    timestamp created_at
  }

  GROUP_MEMBER {
    uuid group_id FK
    uuid user_id FK
    string role
    timestamp joined_at
  }

  GROUP_VOTE {
    uuid id PK
    uuid group_id FK
    uuid venue_id FK
    uuid user_id FK
    int score
    timestamp voted_at
  }

  ITINERARY {
    uuid id PK
    uuid user_id FK
    uuid group_id FK
    string title
    timestamp planned_for
    int total_budget
    string share_code
    timestamp created_at
  }

  ITINERARY_STOP {
    uuid id PK
    uuid itinerary_id FK
    uuid venue_id FK
    uuid event_id FK
    int stop_order
    time arrival_time
    int duration_min
    string note
  }

  LOYALTY_ACCOUNT {
    uuid id PK
    uuid user_id FK
    int total_points
    int lifetime_points
    string tier
    timestamp updated_at
  }

  LOYALTY_TRANSACTION {
    uuid id PK
    uuid loyalty_account_id FK
    uuid checkin_id FK
    string action_type
    int points_delta
    string description
    timestamp created_at
  }

  NIGHT_RECAP {
    uuid id PK
    uuid user_id FK
    timestamp night_date
    int total_spent
    int overall_rating
    string note
    timestamp created_at
  }

  NIGHT_RECAP_STOP {
    uuid recap_id FK
    uuid venue_id FK
    int stop_order
    int amount_spent
    int rating
    string note
  }

  LIVE_CROWD_SIGNAL {
    uuid id PK
    uuid venue_id FK
    int crowd_pct
    int wait_min
    string source
    timestamp captured_at
  }

  VENUE ||--o{ HOURS : "has"
  VENUE ||--o{ EVENT : "hosts"
  VENUE ||--o{ DEAL : "offers"
  VENUE ||--o{ VENUE_PHOTO : "has"
  VENUE ||--o{ CHECKIN : "receives"
  VENUE ||--o{ REVIEW : "receives"
  VENUE ||--o{ SAFETY_FLAG : "receives"
  VENUE ||--o{ LIVE_CROWD_SIGNAL : "emits"
  VENUE }o--|| NEIGHBOURHOOD : "belongs to"
  EVENT ||--o{ EVENT_PERFORMER : "features"
  PERFORMER ||--o{ EVENT_PERFORMER : "plays at"
  USER ||--o{ CHECKIN : "makes"
  USER ||--o{ REVIEW : "writes"
  USER ||--o{ SAFETY_FLAG : "files"
  USER ||--o{ GROUP_PLAN : "creates"
  USER ||--o{ GROUP_MEMBER : "joins as"
  USER ||--o{ GROUP_VOTE : "casts"
  USER ||--o{ ITINERARY : "builds"
  USER ||--|| LOYALTY_ACCOUNT : "has"
  GROUP_PLAN ||--o{ GROUP_MEMBER : "has"
  GROUP_PLAN ||--o{ GROUP_VOTE : "collects"
  GROUP_PLAN ||--o| ITINERARY : "becomes"
  ITINERARY ||--o{ ITINERARY_STOP : "contains"
  LOYALTY_ACCOUNT ||--o{ LOYALTY_TRANSACTION : "tracks"
  LOYALTY_TRANSACTION }o--o| CHECKIN : "triggered by"
  USER ||--o{ NIGHT_RECAP : "logs"
  NIGHT_RECAP ||--o{ NIGHT_RECAP_STOP : "includes"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
